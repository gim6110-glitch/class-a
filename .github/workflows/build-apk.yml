name: Build Android APK

on:
  push:
    branches: [ main, apk-build-test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild final V3 app archive
        run: |
          cat v3final.part1 v3final.part2 v3final.part3 v3final.part4 v3final.part5 v3final.part6 v3final.part7 | base64 -d > project-v3-final.zip
          unzip -t project-v3-final.zip
          rm -rf appsrc
          mkdir -p appsrc
          unzip -q project-v3-final.zip -d appsrc
          ls -la appsrc

      - name: Build debug APK
        run: gradle -p appsrc --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIStickerStudio-V3-final-debug-apk
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
